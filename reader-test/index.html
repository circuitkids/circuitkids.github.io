<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,"><title>Circuit Kids bookshelf (test)</title>
<style>
body{margin:0;background:#fbf7f0;color:#2b2118;font-family:system-ui,sans-serif}
header{padding:16px 16px 8px}h1{font-size:20px;margin:0;color:#9c5214}p.s{margin:4px 0 0;font-size:13px;opacity:.75}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;padding:16px;align-items:start}
.b{display:block;text-decoration:none;color:inherit}
.b img{width:100%;height:auto;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.3);background:#e8dcc6}
.t{font-weight:600;font-size:14px;margin:8px 0 2px}.m{font-size:12px;color:#7a4210}
.bar{height:4px;background:#e3d6bd;border-radius:2px;margin-top:6px}.bar i{display:block;height:4px;background:#9c5214;border-radius:2px}
</style></head><body>
<header><h1>Circuit Kids bookshelf</h1><p class="s">Tap a cover to read. Test version.</p></header>
<div id="shelf"></div>
<script>
var BOOKS=[{id:"pack",title:"The Pack That Came Back",author:"Mendi Taukwena",cover:"pack-cover.jpg",href:"reader.html?b=pack"},{id:"bc",title:"The Butterfly Chase",author:"Mendi Taukwena",cover:"bc-cover.jpg",href:"pages.html?b=bc"}];
var sh=document.getElementById("shelf");
BOOKS.forEach(function(b){var p=parseInt(localStorage.getItem("ck:"+b.id+":pct")||"0",10),has=!!localStorage.getItem("ck:"+b.id+":cfi");
 var a=document.createElement("a");a.className="b";a.href=b.href;
 a.innerHTML='<img alt="Cover of '+b.title+'" src="'+b.cover+'"><div class="t"></div><div class="m"></div>'+(has?'<div class="bar"><i style="width:'+p+'%"></i></div>':'');
 a.querySelector(".t").textContent=b.title;
 a.querySelector(".m").textContent=has?"Continue reading · "+p+"% read":"Start reading";
 sh.appendChild(a);});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script></body></html>
